name: DAIO vNext Integration

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q scripts adapters tests daio
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: CLI recovery smoke
        run: |
          chmod +x ./daio
          ./daio recover
          ./daio sync
          ./daio status
